
name: Supabase Keep Alive

on:
  schedule:
    - cron: '0 12 * * *'
  workflow_dispatch:

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Validar configurações
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail

          if [ -z "$SUPABASE_URL" ]; then
            echo "::error::O secret SUPABASE_URL está vazio ou não está disponível."
            exit 1
          fi

          if [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::O secret SUPABASE_ANON_KEY está vazio ou não está disponível."
            exit 1
          fi

          SUPABASE_URL="${SUPABASE_URL%/}"

          case "$SUPABASE_URL" in
            https://*) ;;
            *)
              echo "::error::SUPABASE_URL precisa começar com https://"
              exit 1
              ;;
          esac

          curl --fail --silent --show-error \
            --max-time 30 \
            "$SUPABASE_URL/rest/v1/empresas?select=id&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY"

          echo
          echo "Supabase acessado com sucesso."
